<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fuel Route Planner</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#17263c;font:16px/1.45 system-ui,-apple-system,sans-serif}header{background:#15324a;color:white;padding:20px 28px}header h1{margin:0;font-size:24px}header p{margin:4px 0 0;color:#c4d9e5}.layout{display:grid;grid-template-columns:minmax(290px,360px) 1fr;min-height:calc(100vh - 88px)}aside{padding:22px;background:white;box-shadow:2px 0 8px #142b3e16;z-index:1}label{display:block;font-weight:650;margin:14px 0 5px}input,select{width:100%;padding:10px;border:1px solid #b8c8d4;border-radius:6px;background:white;font:inherit}.row{display:grid;grid-template-columns:1fr 150px;gap:8px}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:6px;background:#087d70;color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.metric{margin-top:20px;padding:15px;background:#eaf5f2;border-radius:8px}.metric strong{font-size:26px;color:#075c52}.stop{padding:12px 0;border-bottom:1px solid #e0e8ed}.muted{color:#5c6f7e;font-size:14px}.error{color:#a62020;padding:12px 0}#map{height:calc(100vh - 88px);min-height:450px}@media(max-width:750px){.layout{display:block}#map{height:55vh;min-height:350px}}
  </style>
</head>
<body>
<header><h1>Fuel Route Planner</h1><p>US driving routes and cost-aware fuel stops</p></header>
<div class="layout"><aside>
  <form id="route-form">
    <label for="start-city">Start</label><div class="row"><input id="start-city" list="start-cities" value="Dallas" required aria-label="Start city" autocomplete="off"><datalist id="start-cities"></datalist><select id="start-state" required aria-label="Start state">{% for code, name in states %}<option value="{{ code }}"{% if code == "TX" %} selected{% endif %}>{{ code }} — {{ name }}</option>{% endfor %}</select></div>
    <label for="finish-city">Finish</label><div class="row"><input id="finish-city" list="finish-cities" value="Atlanta" required aria-label="Finish city" autocomplete="off"><datalist id="finish-cities"></datalist><select id="finish-state" required aria-label="Finish state">{% for code, name in states %}<option value="{{ code }}"{% if code == "GA" %} selected{% endif %}>{{ code }} — {{ name }}</option>{% endfor %}</select></div>
    <button id="submit" type="submit">Find route and fuel stops</button>
  </form>
  <div id="result" aria-live="polite"><p class="muted">Choose two US cities, then plan a route.</p></div>
</aside><div id="map" role="img" aria-label="Route map"></div></div>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script>
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[-98,39],zoom:3});
map.addControl(new maplibregl.NavigationControl(),'top-right');
let markers=[];
const result=document.getElementById('result'),button=document.getElementById('submit');
async function loadCities(prefix){
  const state=document.getElementById(`${prefix}-state`).value;
  const list=document.getElementById(`${prefix}-cities`);
  const response=await fetch(`/api/cities/?state=${encodeURIComponent(state)}`);
  if(!response.ok)return;
  const data=await response.json();
  list.replaceChildren(...data.cities.map(city=>{const option=document.createElement('option');option.value=city;return option}));
}
for(const prefix of ['start','finish']){
  document.getElementById(`${prefix}-state`).addEventListener('change',()=>{document.getElementById(`${prefix}-city`).value='';loadCities(prefix)});
  loadCities(prefix);
}
function drawRoute(data){
  const geometry=data.route.geometry;
  const feature={type:'Feature',properties:{},geometry};
  const update=()=>{
    if(map.getSource('route'))map.getSource('route').setData(feature);
    else{map.addSource('route',{type:'geojson',data:feature});map.addLayer({id:'route-line',type:'line',source:'route',paint:{'line-color':'#087d70','line-width':5}})}
  };
  if(map.isStyleLoaded())update();else map.once('load',update);
  markers.forEach(marker=>marker.remove());markers=[];
  const marker=(longitude,latitude,color,label)=>{
    const popup=document.createElement('div');popup.textContent=label;
    markers.push(new maplibregl.Marker({color}).setLngLat([longitude,latitude]).setPopup(new maplibregl.Popup().setDOMContent(popup)).addTo(map));
  };
  marker(data.start.longitude,data.start.latitude,'#15324a','Start');
  marker(data.finish.longitude,data.finish.latitude,'#15324a','Finish');
  data.fuel_stops.forEach((stop,index)=>marker(stop.longitude,stop.latitude,'#e09624',`${index+1}. ${stop.name}, ${stop.city}, ${stop.state} — $${stop.price_per_gallon.toFixed(3)}/gal`));
  const bounds=geometry.coordinates.reduce((box,coordinate)=>box.extend(coordinate),new maplibregl.LngLatBounds());
  map.fitBounds(bounds,{padding:35,maxZoom:11});
}
document.getElementById('route-form').addEventListener('submit',async event=>{
  event.preventDefault();button.disabled=true;result.textContent='Finding route…';
  const body={start:{city:document.getElementById('start-city').value,state:document.getElementById('start-state').value},finish:{city:document.getElementById('finish-city').value,state:document.getElementById('finish-state').value}};
  try{
    const response=await fetch('/api/route/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await response.json();if(!response.ok)throw Error(data.error||'Route failed');
    drawRoute(data);
    const summary=data.fuel_summary;
    result.className='';result.replaceChildren();
    const metric=document.createElement('div');metric.className='metric';metric.innerHTML=`<strong>$${summary.total_money_spent_usd.toFixed(2)}</strong><br>Estimated trip fuel cost<br><span class="muted">${data.route.distance_miles.toFixed(1)} miles · ${data.fuel_stops.length} roadside stop${data.fuel_stops.length===1?'':'s'}</span>`;result.append(metric);
    const note=document.createElement('p');note.className='muted';note.textContent='Includes estimated cost of fuel used from the starting tank. Stops use approximate city coordinates.';result.append(note);
    data.fuel_stops.forEach((stop,index)=>{const item=document.createElement('div');item.className='stop';item.textContent=`${index+1}. ${stop.name} — ${stop.city}, ${stop.state} · mile ${stop.mile_marker.toFixed(0)} · ${stop.gallons_purchased.toFixed(1)} gal at $${stop.price_per_gallon.toFixed(3)}/gal`;result.append(item)});
  }catch(error){result.textContent=error.message;result.className='error'}finally{button.disabled=false}
});
</script>
</body>
</html>
